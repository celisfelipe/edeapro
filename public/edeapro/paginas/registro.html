<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EDEA PRO Peluquería</title>
    <meta name="description" content="Crea tu cuenta en EDEA PRO y agenda citas para tu mascota">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/registro.css">
    
</head>

<body>
    <!-- FONDO ANIMADO -->
    <div class="animated-bg">
        <div class="bubble bubble1"></div>
        <div class="bubble bubble2"></div>
        <div class="bubble bubble3"></div>
        <div class="bubble bubble4"></div>
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
    </div>

    <main class="registro-container">
        <div class="registro-box">
            <div class="registro-header">
                <h1>🐾 Registro en EDEA PRO 🐾</h1>
                <p>Crea tu cuenta y agenda citas para tu mascota</p>
            </div>

            <form id="registroForm">
                <!-- ============ SECCIÓN 1: DATOS DEL CLIENTE ============ -->
                <section class="form-section cliente-section">
                    <div class="section-title">
                        <h2>👤 Registro de Cliente</h2>
                        <div class="line"></div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombre-cliente">Nombre </label>
                            <input type="text" id="nombre-cliente" name="nombre-cliente" placeholder="Tu nombre"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="apellido-cliente">Apellido </label>
                            <input type="text" id="apellido-cliente" name="apellido-cliente" placeholder="Tu apellido"
                                required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Correo Electrónico </label>
                            <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="(+57) 350 507 3843" required>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="contrasena">Contraseña *</label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 8 caracteres"
                            minlength="8" required>
                        <small>La contraseña debe tener al menos 8 caracteres</small>
                    </div>

                    <div class="form-group full-width">
                        <label for="confirmar-contrasena">Confirmar Contraseña *</label>
                        <input type="password" id="confirmar-contrasena" name="confirmar-contrasena"
                            placeholder="Confirma tu contraseña" minlength="8" required>
                    </div>
                </section>

                <!-- ============ SECCIÓN 2: DATOS DE MASCOTAS ============ -->
                <section class="form-section mascota-section">
                    <div class="section-title">
                        <h2>🐕 Registro de Mascotas</h2>
                        <div class="line"></div>
                    </div>

                    <div id="mascotas-container">
                        <!-- Las mascotas se agregarán aquí dinámicamente -->
                        <div class="mascota-form" data-mascota="1">
                            <h3>Mascota #1</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="nombre-mascota-1">Nombre de la Mascota *</label>
                                    <input type="text" id="nombre-mascota-1" name="nombre-mascota-1"
                                        placeholder="Ej: Max, Luna" required>
                                </div>
                                <div class="form-group">
                                    <label for="edad-mascota-1">Edad *</label>
                                    <input type="number" id="edad-mascota-1" name="edad-mascota-1" placeholder="Años"
                                        min="0" max="50" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="genero-mascota-1">Género *</label>
                                    <select id="genero-mascota-1" name="genero-mascota-1" required>
                                        <option value="">-- Selecciona --</option>
                                        <option value="macho">Macho</option>
                                        <option value="hembra">Hembra</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="tipo-mascota-1">Tipo de Mascota *</label>
                                    <select id="tipo-mascota-1" name="tipo-mascota-1" required>
                                        <option value="">-- Selecciona --</option>
                                        <option value="perro">Perro</option>
                                        <option value="gato">Gato</option>
                                        <option value="otro">Otro</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BOTONES DE MASCOTAS -->
                    <div class="mascota-buttons">
                        <button type="button" class="btn btn-secondary" id="btn-agregar-mascota">
                            ➕ Agregar otra Mascota
                        </button>
                    </div>
                </section>

                <!-- ============ TÉRMINOS Y BOTÓN FINAL ============ -->
                <section class="form-section terminos-section">
                    <div class="form-group checkbox">
                        <input type="checkbox" id="terminos" name="terminos" required>
                        <label for="terminos">Acepto los términos y condiciones de EDEA PRO *</label>
                    </div>

                    <div class="form-group checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Deseo recibir ofertas y promociones</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large">
                        ✓ Finalizar Registro
                    </button>
                </section>

                <div id="message" class="message"></div>
            </form>

            <p class="login-link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </main>

    <script src="../scripts/registro.js"></script>
</body>

</html>
