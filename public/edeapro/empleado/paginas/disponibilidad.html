<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Agenda - Empleado</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/principal.css">
    <link rel="stylesheet" href="../../estilos/agenda-grilla.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <script>
        // Aplicar el estado guardado del sidebar ANTES de pintar, para evitar el parpadeo
        // (aparece expandido un instante y luego se colapsa) al navegar entre páginas.
        if (window.innerWidth > 900 && localStorage.getItem('sidebarCollapsed') === '1') {
            document.body.classList.add('sidebar-collapsed');
        }
    </script>

    <div class="sidebar">
        <h2>Empleado</h2>
        <ul>
            <li><a href="inicio.html"><i class="fa-solid fa-scissors"></i><span class="label">Servicios</span></a></li>
            <li><a href="clientes.html"><i class="fa-solid fa-users"></i><span class="label">Clientes</span></a></li>
            <li><a href="disponibilidad.html" class="active"><i class="fa-solid fa-calendar-days"></i><span class="label">Mi agenda</span></a></li>
        </ul>
    </div>
    <div class="sidebar-overlay"></div>

    <div class="main">

        <div class="header">
            <div class="header-title">
                <button class="hamburger-btn" id="sidebarToggle" aria-label="Alternar menú"><i class="fa-solid fa-bars"></i></button>
                <h1>Mi Agenda</h1>
            </div>
            <p id="nombre-empleado">Cargando...</p>
            <button class="btn btn-red" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>

        <!-- Grilla de agenda del estilista (solo sus citas) -->
        <div class="card grilla-card">
            <div class="grilla-topbar">
                <div class="grilla-topbar-left">
                    <h2><i class="fa-solid fa-calendar-days"></i> Agenda</h2>
                    <div class="grilla-nav">
                        <button class="btn" onclick="cambiarDia(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <button class="btn" onclick="irHoy()">Hoy</button>
                        <button class="btn" onclick="cambiarDia(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <span id="grilla-fecha-label">Cargando...</span>
                </div>
                <div class="grilla-leyenda">
                    <span class="leyenda-item leyenda-pendiente">Pendiente</span>
                    <span class="leyenda-item leyenda-completada">Completada</span>
                    <span class="leyenda-item leyenda-cancelada">Cancelada</span>
                </div>
            </div>
            <div class="grilla-scroll">
                <div class="grilla-agenda" id="grilla-agenda"></div>
            </div>
        </div>

    </div>

    <!-- Panel lateral de detalle de cita (lo abre agendaGrilla.js al hacer clic en una cita) -->
    <div class="modal-overlay detalle-overlay" id="modal-detalle-overlay">
        <div class="detalle-panel" id="modal-detalle-panel">
            <div class="detalle-header">
                <h3><i class="fa-solid fa-calendar-check"></i> Detalle de cita</h3>
                <button class="detalle-close" id="modal-detalle-close" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="detalle-body">
                <div class="detalle-row">
                    <span class="detalle-label"><i class="fa-solid fa-user"></i> Cliente</span>
                    <span class="detalle-value" id="detalle-cliente">—</span>
                </div>
                <div class="detalle-row">
                    <span class="detalle-label"><i class="fa-solid fa-paw"></i> Mascota</span>
                    <span class="detalle-value" id="detalle-mascota">—</span>
                </div>
                <div class="detalle-row">
                    <span class="detalle-label"><i class="fa-solid fa-scissors"></i> Servicio</span>
                    <span class="detalle-value" id="detalle-servicio">—</span>
                </div>
                <div class="detalle-row">
                    <span class="detalle-label"><i class="fa-solid fa-user-tie"></i> Estilista</span>
                    <span class="detalle-value" id="detalle-estilista">—</span>
                </div>
                <div class="detalle-row">
                    <span class="detalle-label"><i class="fa-solid fa-calendar-days"></i> Fecha</span>
                    <span class="detalle-value" id="detalle-fecha">—</span>
                </div>
                <div class="detalle-row">
                    <span class="detalle-label"><i class="fa-solid fa-clock"></i> Hora</span>
                    <span class="detalle-value" id="detalle-hora">—</span>
                </div>
                <div class="detalle-row">
                    <span class="detalle-label"><i class="fa-solid fa-circle-info"></i> Estado</span>
                    <span class="detalle-value" id="detalle-estado">—</span>
                </div>
            </div>
        </div>
    </div>

    <script src="../../scripts/fetchToken.js"></script>
    <script src="../../scripts/formatoHora.js"></script>
    <script src="../../scripts/agendaGrilla.js"></script>
    <script src="../scripts/disponibilidad.js"></script>
    <script src="../../scripts/sidebar-toggle.js"></script>
</body>
</html>
