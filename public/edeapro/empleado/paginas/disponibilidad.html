<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Disponibilidad - Empleado</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/principal.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <script>
        // Aplicar el estado guardado del sidebar ANTES de pintar, para evitar el parpadeo
        // (aparece expandido un instante y luego se colapsa) al navegar entre páginas.
        if (window.innerWidth > 900 && localStorage.getItem('sidebarCollapsed') === '1') {
            document.body.classList.add('sidebar-collapsed');
        }
    </script>

    <div class="sidebar">
        <h2>Empleado</h2>
        <ul>
            <li><a href="inicio.html"><i class="fa-solid fa-scissors"></i><span class="label">Servicios</span></a></li>
            <li><a href="clientes.html"><i class="fa-solid fa-users"></i><span class="label">Clientes</span></a></li>
            <li><a href="disponibilidad.html" class="active"><i class="fa-solid fa-calendar-days"></i><span class="label">Disponibilidad</span></a></li>
        </ul>
    </div>
    <div class="sidebar-overlay"></div>

    <div class="main">

        <div class="header">
            <div class="header-title">
                <button class="hamburger-btn" id="sidebarToggle" aria-label="Alternar menú"><i class="fa-solid fa-bars"></i></button>
                <h1>Mi Disponibilidad</h1>
            </div>
            <p id="nombre-empleado">Cargando...</p>
            <button class="btn btn-red" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>

        <div class="card">
            <div class="fecha-selector">
                <label><strong><i class="fa-solid fa-calendar-days"></i> Ver horarios del día:</strong></label>
                <input type="date" id="fecha-selector">
                <button class="btn btn-blue" onclick="cargarHorarios()"><i class="fa-solid fa-eye"></i> Ver</button>
            </div>
            <div id="contenedor-horarios">
                <p>Selecciona una fecha para ver tus horarios.</p>
            </div>
        </div>

    </div>
    
    <script src="../../scripts/fetchToken.js"></script>
    <script src="../scripts/disponibilidad.js"></script>
    <script src="../../scripts/sidebar-toggle.js"></script>
</body>
</html>
