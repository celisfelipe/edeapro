<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Disponibilidad - Empleado</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/principal.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="sidebar">
        <h2>Empleado</h2>
        <ul>
            <li><a href="inicio.html">Servicios</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="disponibilidad.html">Disponibilidad</a></li>
        </ul>
    </div>

    <div class="main">

        <div class="header">
            <h1>Mi Disponibilidad</h1>
            <p id="nombre-empleado">Cargando...</p>
            <button class="btn btn-red" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>

        <div class="card">
            <div class="fecha-selector">
                <label><strong>Ver horarios del día:</strong></label>
                <input type="date" id="fecha-selector">
                <button class="btn btn-blue" onclick="cargarHorarios()">Ver</button>
            </div>
            <div id="contenedor-horarios">
                <p>Selecciona una fecha para ver tus horarios.</p>
            </div>
        </div>

    </div>
    
    <script src="../../scripts/fetchToken.js"></script>
    <script src="../scripts/disponibilidad.js"></script>
