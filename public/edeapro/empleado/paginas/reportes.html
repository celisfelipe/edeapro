<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Empleado - Reportes</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/principal.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <script>
        // Aplicar el estado guardado del sidebar ANTES de pintar, para evitar el parpadeo
        // (aparece expandido un instante y luego se colapsa) al navegar entre páginas.
        if (window.innerWidth > 900 && localStorage.getItem('sidebarCollapsed') === '1') {
            document.body.classList.add('sidebar-collapsed');
        }
    </script>

    <div class="sidebar">
        <h2>Empleado</h2>
        <ul>
            <li><a href="inicio.html"><i class="fa-solid fa-scissors"></i><span class="label">Servicios</span></a></li>
            <li><a href="clientes.html"><i class="fa-solid fa-users"></i><span class="label">Clientes</span></a></li>
            <li><a href="disponibilidad.html"><i class="fa-solid fa-calendar-days"></i><span class="label">Mi agenda</span></a></li>
            <li><a href="reportes.html" class="active"><i class="fa-solid fa-file-lines"></i><span class="label">Reportes</span></a></li>
        </ul>
        <!-- Pie del sidebar: siempre al final de la navegación -->
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i><span class="label">Cerrar sesión</span></button>
        </div>
    </div>
    <div class="sidebar-overlay"></div>

    <div class="main">

        <div class="header">
            <div class="header-title">
                <button class="hamburger-btn" id="sidebarToggle" aria-label="Alternar menú"><i class="fa-solid fa-bars"></i></button>
                <h1>Mis Reportes</h1>
            </div>
            <p id="nombre-empleado">Cargando...</p>
        </div>

        <div class="reportes-grid">
            <div class="card reporte-card">
                <h2><i class="fa-solid fa-calendar-check"></i> Mis citas</h2>
                <p>Todas las citas que tienes asignadas, con cliente, mascota, servicio y estado.</p>
                <div class="reporte-acciones">
                    <button type="button" class="btn btn-red" onclick="descargarMisCitas('pdf', this)"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                    <button type="button" class="btn btn-green" onclick="descargarMisCitas('excel', this)"><i class="fa-solid fa-file-excel"></i> Excel</button>
                </div>
                <p class="reporte-estado" id="reporte-estado" role="alert"></p>
            </div>
        </div>

    </div>

    <script src="../../scripts/fetchToken.js"></script>
    <script src="../scripts/sesion.js"></script>
    <script src="../../scripts/descargas.js"></script>
    <script src="../scripts/reportes.js"></script>
    <script src="../../scripts/sidebar-toggle.js"></script>
</body>

</html>
