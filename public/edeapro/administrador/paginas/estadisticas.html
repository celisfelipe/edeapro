<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" href="/edeapro/imagenes/logo/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/edeapro/imagenes/logo/favicon/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/edeapro/imagenes/logo/favicon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/edeapro/imagenes/logo/favicon/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/edeapro/imagenes/logo/favicon/favicon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/edeapro/imagenes/logo/favicon/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Administrador</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/principal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../estilos/identidad.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body>
    <script>
        // Aplicar el estado guardado del sidebar ANTES de pintar, para evitar el parpadeo
        // (aparece expandido un instante y luego se colapsa) al navegar entre páginas.
        if (window.innerWidth > 900 && localStorage.getItem('sidebarCollapsed') === '1') {
            document.body.classList.add('sidebar-collapsed');
        }
    </script>

    <div class="sidebar">
        <h2>Administrador</h2>
        <ul>
            <li><a href="inicio.html"><i class="fa-solid fa-calendar-check"></i><span class="label">Citas</span></a></li>
            <li><a href="horarios.html"><i class="fa-solid fa-clock"></i><span class="label">Horarios / Disponibilidad</span></a></li>
            <li><a href="clientes.html"><i class="fa-solid fa-users"></i><span class="label">Clientes</span></a></li>
            <li><a href="servicios.html"><i class="fa-solid fa-scissors"></i><span class="label">Servicios</span></a></li>
            <li><a href="empleados.html"><i class="fa-solid fa-user-tie"></i><span class="label">Empleados</span></a></li>
            <li><a href="notificaciones.html"><i class="fa-solid fa-bell"></i><span class="label">Notificaciones</span></a></li>
            <li><a href="estadisticas.html" class="active"><i class="fa-solid fa-chart-line"></i><span class="label">Estadísticas</span></a></li>
            <li><a href="pagos.html"><i class="fa-solid fa-credit-card"></i><span class="label">Pagos</span></a></li>
            <li><a href="reportes.html"><i class="fa-solid fa-file-lines"></i><span class="label">Reportes</span></a></li>
        </ul>
        <!-- Pie del sidebar: siempre al final de la navegación -->
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i><span class="label">Cerrar sesión</span></button>
        </div>
    </div>
    <div class="sidebar-overlay"></div>

    <div class="main">

        <div class="header">
            <div class="header-title">
                <button class="hamburger-btn" id="sidebarToggle" aria-label="Alternar menú"><i class="fa-solid fa-bars"></i></button>
                <h1>Estadísticas</h1>
            </div>
            <p id="nombre-admin">Cargando...</p>
        </div>

        <!-- Tarjetas de resumen -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                <h3 id="total-clientes">-</h3>
                <p>Clientes registrados</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-calendar-check"></i></div>
                <h3 id="total-citas">-</h3>
                <p>Citas totales</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-coins"></i></div>
                <h3 id="total-ingresos">-</h3>
                <p>Ingresos totales</p>
            </div>
        </div>

        <!-- Gráfico de torta: citas por estado -->
        <div class="card">
            <h2><i class="fa-solid fa-chart-pie"></i> Citas por estado</h2>
            <div class="grafico-caja">
                <canvas id="graficoCitas"></canvas>
            </div>
        </div>

            <!-- Gráfico de barras: servicios más solicitados -->
        <div class="card">
            <h2><i class="fa-solid fa-chart-column"></i> Servicios más solicitados</h2>
            <div class="grafico-caja">
                <canvas id="graficoServicios"></canvas>
            </div>
        </div>

    </div>

    <script src="../../scripts/config.js"></script>
    <script src="../../scripts/fetchToken.js"></script>
    <script src="../scripts/sesion.js"></script>
    <script src="../scripts/estadisticas.js"></script>
    <script src="../../scripts/sidebar-toggle.js"></script>
    <script src="../../scripts/utils.js"></script>
</body>
</html>
