<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios - Administrador</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/principal.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <h2>Administrador</h2>
        <ul>
            <li><a href="inicio.html"><i class="fa-solid fa-calendar-check"></i><span class="label">Citas</span></a></li>
            <li><a href="horarios.html"><i class="fa-solid fa-clock"></i><span class="label">Horarios / Disponibilidad</span></a></li>
            <li><a href="clientes.html"><i class="fa-solid fa-users"></i><span class="label">Clientes</span></a></li>
            <li><a href="servicios.html" class="active"><i class="fa-solid fa-scissors"></i><span class="label">Servicios</span></a></li>
            <li><a href="empleados.html"><i class="fa-solid fa-user-tie"></i><span class="label">Estilistas</span></a></li>
            <li><a href="notificaciones.html"><i class="fa-solid fa-bell"></i><span class="label">Notificaciones</span></a></li>
            <li><a href="estadisticas.html"><i class="fa-solid fa-chart-line"></i><span class="label">Estadísticas</span></a></li>
            <li><a href="pagos.html"><i class="fa-solid fa-credit-card"></i><span class="label">Pagos</span></a></li>
        </ul>
    </div>
    <div class="sidebar-overlay"></div>

    <div class="main">

        <div class="header">
            <div class="header-title">
                <button class="hamburger-btn" id="sidebarToggle" aria-label="Alternar menú"><i class="fa-solid fa-bars"></i></button>
                <h1>Servicios</h1>
            </div>
            <p id="nombre-admin">Cargando...</p>
            <button class="btn btn-red" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>

        <div class="card">
            <div id="contenedor-servicios">
                <p>Cargando servicios...</p>
            </div>
        </div>

    </div>

    <!-- Modal para editar precio y duración de un servicio -->
    <div class="modal-overlay" id="modal-editar-servicio">
        <div class="modal">
            <h3>Editar servicio</h3>
            <div class="modal-form-group">
                <label>Duración (ej: 45 min)</label>
                <input type="text" id="edit-svc-duracion">
            </div>
            <div class="modal-form-group">
                <label>Precio (solo números)</label>
                <input type="number" id="edit-svc-precio">
            </div>
            <div class="modal-footer">
                <button class="btn" style="background:#eee;" id="edit-servicio-cancel">Cancelar</button>
                <button class="btn btn-blue" id="edit-servicio-ok">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div class="modal-overlay" id="modal-confirmar">
        <div class="modal">
            <h3>Confirmar acción</h3>
            <p id="modal-confirmar-msg"></p>
            <div class="modal-footer">
                <button class="btn" style="background:#eee;" id="modal-confirmar-cancel">Cancelar</button>
                <button class="btn btn-red" id="modal-confirmar-ok">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal de operación exitosa -->
    <div class="modal-overlay" id="modal-exito">
        <div class="modal">
            <h3>Operación exitosa</h3>
            <p id="modal-exito-msg"></p>
            <div class="modal-footer">
                <button class="btn btn-blue" id="modal-exito-ok">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- Modal de error -->
    <div class="modal-overlay" id="modal-error">
        <div class="modal">
            <h3>Ha ocurrido un error</h3>
            <p id="modal-error-msg"></p>
            <div class="modal-footer">
                <button class="btn btn-red" id="modal-error-ok">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../../scripts/fetchToken.js"></script>
    <script src="../scripts/modal.js"></script>
    <script src="../scripts/servicios.js"></script>
    <script src="../../scripts/sidebar-toggle.js"></script>
</body>
</html>
